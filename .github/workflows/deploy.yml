name: CD - Deploy to cPanel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, mysql, bcmath, gd, zip
          coverage: none

      - name: Install Composer dependencies (production)
        working-directory: laravel_app
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build front-end assets
        working-directory: laravel_app
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run build
          fi

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.CPANEL_SSH_PORT }} -H ${{ secrets.CPANEL_SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy files with rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.CPANEL_SSH_PORT }}" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude 'storage/app' \
            --exclude 'storage/logs' \
            --exclude 'storage/framework/cache' \
            --exclude 'storage/framework/sessions' \
            --exclude 'storage/framework/views' \
            laravel_app/ \
            ${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_SSH_HOST }}:${{ secrets.CPANEL_DEPLOY_PATH }}/laravel_app/

      - name: Run post-deploy commands on server
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.CPANEL_SSH_PORT }} \
            ${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_SSH_HOST }} \
            "cd ${{ secrets.CPANEL_DEPLOY_PATH }}/laravel_app && \
             php artisan migrate --force && \
             php artisan config:cache && \
             php artisan route:cache && \
             php artisan view:cache && \
             php artisan storage:link || true"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
