name: Port Check (temporary)

on:
  workflow_dispatch:

jobs:
  scan:
          environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Scan common SSH ports on host
        run: |
          HOST="${{ secrets.CPANEL_SSH_HOST }}"
          echo "Scanning host: $HOST"
          for PORT in 22 2222 2200 21098 7822 18765 2022 2020; do
            if timeout 5 bash -c "cat < /dev/null > /dev/tcp/$HOST/$PORT" 2>/dev/null; then
              echo "OPEN  -> port $PORT is OPEN"
            else
              echo "closed-> port $PORT is closed/filtered"
            fi
          done
          echo "Scan finished."
