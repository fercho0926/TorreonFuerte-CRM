<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0d6efd">
    <title>Sin conexión · CRM Torreón Fuerte</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f4f6f9; color: #212529; text-align: center; }
        main { max-width: 22rem; }
        img { width: 5rem; height: 5rem; border-radius: 1.2rem; margin-bottom: 1rem; }
        h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
        p { margin: 0 0 1rem; line-height: 1.5; color: #495057; }
        button { min-height: 2.75rem; min-width: 11rem; padding: .5rem 1.25rem; font-size: 1rem; font-weight: 600; color: #fff; background: #0d6efd; border: 0; border-radius: .5rem; }
        button:active { background: #0b5ed7; }
    </style>
</head>
<body>
    <main role="main">
        <img src="iconos/icono-192.png" alt="" width="80" height="80">
        <h1>Sin conexión</h1>
        <p>No pudimos conectarnos. Revisa tu señal o tus datos móviles. Lo que estabas escribiendo se conserva en esta pestaña.</p>
        <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
</body>
</html>
